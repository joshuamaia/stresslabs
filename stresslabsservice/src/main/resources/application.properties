spring.application.name=stresslabsservice
server.port=${SERVER_PORT:8080}

# Virtual threads para o servidor web (Tomcat) e tarefas
spring.threads.virtual.enabled=true
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:500}
server.shutdown=graceful

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stresslabs}
spring.datasource.username=${DB_USERNAME:stresslabs}
spring.datasource.password=${DB_PASSWORD:stresslabs}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator / Micrometer
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# Lab
stresslabs.load-generator.url=${LOAD_GENERATOR_URL:http://localhost:8081}
stresslabs.load-generator.connect-timeout=2s
stresslabs.load-generator.read-timeout=5s
stresslabs.internal-token=${INTERNAL_TOKEN:dev-internal-token}
stresslabs.security.admin-local-only=${ADMIN_LOCAL_ONLY:true}
stresslabs.limits.max-requests=${LIMIT_MAX_REQUESTS:200000}
stresslabs.limits.max-concurrency=${LIMIT_MAX_CONCURRENCY:500}
stresslabs.limits.max-duration-seconds=${LIMIT_MAX_DURATION_SECONDS:300}
stresslabs.limits.max-rps=${LIMIT_MAX_RPS:5000}
stresslabs.limits.min-timeout-ms=100
stresslabs.limits.max-timeout-ms=30000
stresslabs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
