server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # Server-Sent Events: sem buffer e com conexões longas
    location ~ ^/api/admin/load-tests/[^/]+/stream$ {
        proxy_pass http://api-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Somente as rotas administrativas são expostas ao navegador (as internas ficam na rede Docker)
    location /api/admin/ {
        proxy_pass http://api-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/internal/ {
        return 403;
    }

    location /api/target/ {
        proxy_pass http://api-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
