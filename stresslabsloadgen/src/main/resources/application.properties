spring.application.name=stresslabsloadgen
server.port=${SERVER_PORT:8081}
spring.threads.virtual.enabled=true
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# Destino dos testes: somente a API interna (nome do serviço Docker, nunca URL informada pelo usuário)
loadgen.target-base-url=${TARGET_BASE_URL:http://localhost:8080}
loadgen.allowed-path-prefixes=${ALLOWED_PATH_PREFIXES:/api/target/}
# Backend que recebe snapshots e resultados
loadgen.backend-url=${BACKEND_URL:http://localhost:8080}
loadgen.internal-token=${INTERNAL_TOKEN:dev-internal-token}
loadgen.snapshot-interval=1s
loadgen.limits.max-requests=${LIMIT_MAX_REQUESTS:200000}
loadgen.limits.max-concurrency=${LIMIT_MAX_CONCURRENCY:500}
loadgen.limits.max-duration-seconds=${LIMIT_MAX_DURATION_SECONDS:300}
loadgen.limits.max-rps=${LIMIT_MAX_RPS:5000}
loadgen.limits.min-timeout-ms=100
loadgen.limits.max-timeout-ms=30000
